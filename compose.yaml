
name: aitutor

services:
  app:
    build:
      context: .
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
      - hf-cache:/opt/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  hf-cache:
