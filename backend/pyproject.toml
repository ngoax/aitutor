[project]
name = "aitutor-backend"
version = "0.1.0"
description = "Authoring tool for generating OATutor tutoring content from course materials"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.12",
    "xberg>=1.0.14",
    "langchain-xberg>=1.0.14",
    "langchain-huggingface>=1.2.2",
    "langchain-chroma>=1.1.0",
    "sentence-transformers>=5.7.0",
    "langchain-openai>=1.5.0",
    "langchain-anthropic>=1.5.6",
    "langchain-ollama>=1.1.0",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
# Alembic writes these; column definitions exceed the line length and the
# template is regenerated on every revision.
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a live model server, so the default run stays offline
# and fast. A `-m` on the command line replaces this one: `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a live external service (Ollama); deselected by default",
]

[tool.uv]
package = false
