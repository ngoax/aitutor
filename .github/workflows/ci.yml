name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Integration tests are deselected by pyproject's addopts: no model server here.
      - run: uv run pytest
      # Builds the schema from the migrations, then fails if the models have
      # drifted from it. Catches a model change committed without a revision.
      - name: Migrations match models
        run: |
          mkdir -p "$DATA_DIR"
          PYTHONPATH=. uv run alembic upgrade head
          PYTHONPATH=. uv run alembic check
        env:
          DATA_DIR: ${{ runner.temp }}/ci-data

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
